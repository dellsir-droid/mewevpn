# What makes this repo's app different. Sourced by scripts/common.sh; the linux/ windows/ macos/ ios/ build menus follow the other mewe* repos.
APP_NAME="MeWeTail"                        # product name (window title, .app/.exe, Start-menu entry)
APP_SLUG="mewetail"
APP_VERSION="1.0.0"                        # every result is named <APP_NAME>-<APP_VERSION>.<ext>, e.g. MeWeTail-1.0.0.apk
APP_ID="org.m-we.tail"                     # bundle id (desktop, iOS). Android's applicationId is org.m_we.tail (underscore) in android/android/build.gradle
APP_SCHEME=""                              # no custom URL scheme: sign-in happens in the browser on the server (Headscale + OIDC), no redirect back to the app
APP_DESC="Private network (Tailscale-compatible) for your MeWe devices"
LINUX_CATEGORY="Network;"                  # freedesktop categories
MAC_CATEGORY="public.app-category.utilities"
ICON_NAME="mewetail.png"                   # file in $SHARED_ROOT/media/content/icons/mewe/ (falls back to design/mewetail.png in this repo)
EXPORT_SUB="mewe"                          # outputs go to $SYNC_ROOT/<os>/$EXPORT_SUB
UI_DIR="ui"                                # the desktop window's own HTML UI (one copy for linux/windows/macos)
START_URL=""
FALLBACK_URL=""
OIDC_CLIENT=""                             # sign-in is Headscale's: it sends the browser to oidc.m-we.org (realm mwe) for you
AUTH_GLOBAL=""
CONTROL_URL="https://hs.m-we.org"          # default server (Headscale); the app lets the user change it
NATIVE_CONFIG='{"controlUrl":"https://hs.m-we.org"}'
